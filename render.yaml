# Render blueprint. Point Render at this repo and it picks this up.
#
# The database is not in version control, so it is built during deploy: the
# ingest pulls fresh prices from TCGdex and TCGCSV, then Next builds against it.
# That means every deploy ships current prices, and no third-party pricing data
# ever lands in git.
services:
  - type: web
    name: pull-tracker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run ingest && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional: eBay developer keys so PSA graded prices work (Browse API).
      # - key: EBAY_CLIENT_ID
      #   sync: false
      # - key: EBAY_CLIENT_SECRET
      #   sync: false
      # Optional: affiliate tags on outbound shop links (off when unset).
      # - key: TCGPLAYER_AFFILIATE_URL   # e.g. https://tcgplayer.pxf.io/c/1234567/1830156/21018
      #   sync: false
      # - key: EBAY_CAMPAIGN_ID          # eBay Partner Network campaign ID
      #   sync: false

  <polygon points="29.9,13.3 51.6,17.2 46.1,48.7 24.4,44.8" fill="#b06bff" stroke="#b06bff" stroke-width="5" stroke-linejoin="round"/>
  <!-- The hit. -->
  <path d="M38 22 L40.3 28.7 L47 31 L40.3 33.3 L38 40 L35.7 33.3 L29 31 L35.7 28.7 Z" fill="#ffffff"/>
</svg>
